name: 'Publish EMR Spark to Env'
description: 'Publishes the EMR Spark Docker image to ECR for a given region and runner'
inputs:
  aws-region:
    description: 'AWS region'
    required: true
runs:
  using: "composite"
  steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      shell: bash
      run: |
        gunzip -c image.tar.gz | docker load
        echo "📦 Loaded Docker image"

    - name: Get AWS Account ID
      id: aws-account
      shell: bash
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "account_id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: Publish to ECR
      shell: bash
      run: |
        make publish-emr-spark-to-region \
          AWS_ACCOUNT_ID=${{ steps.aws-account.outputs.account_id }} \
          AWS_REGION=${{ inputs.aws-region }}
