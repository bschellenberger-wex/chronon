name: 'Publish EMR Spark to Env'
description: 'Publishes the EMR Spark Docker image to ECR for all regions'
inputs:
  regions:
    description: 'Comma-separated list of AWS regions to publish to'
    required: false
    default: 'us-east-1,us-west-2'
runs:
  using: "composite"
  steps:
    - name: Download Docker image artifact
      uses: actions/download-artifact@v4
      with:
        name: docker-image

    - name: Load Docker image
      shell: bash
      run: |
        gunzip -c image.tar.gz | docker load
        echo "📦 Loaded Docker image"

    - name: Publish to ECR (All Regions)
      shell: bash
      run: |
        # Convert comma-separated regions to space-separated for Makefile
        REGIONS=$(echo "${{ inputs.regions }}" | tr ',' ' ')
        make publish-emr-spark REGIONS="$REGIONS"
