name: "Build and Publish Chronon"

on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: "Run tests after building"
        required: false
        default: true
        type: boolean
      dry_run:
        description: "Perform a dry run (no actual upload)"
        required: false
        default: false
        type: boolean
      force_overwrite:
        description: "Force overwrite artifacts in Artifactory (skip existence check)"
        required: false
        default: false
        type: boolean

jobs:
  # Job 1: Build the code on a standard GitHub runner
  build:
    runs-on: ubuntu-latest
    outputs:
      build-version: ${{ steps.version_info.outputs.full_version }}
      group-id: ${{ steps.version_info.outputs.group_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          java-version: 8
          distribution: temurin

      - name: Setup Thrift 0.13
        uses: ./.github/actions/setup-thrift

      - name: Get Version Information
        id: version_info
        run: |
          echo "📋 Getting version information..."
          FULL_VERSION=$(./.github/scripts/generate_version.sh version)
          source .github/MAVEN_VERSION
          echo "Full version: $FULL_VERSION"
          echo "Group ID: $group_id"
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "group_id=$group_id" >> $GITHUB_OUTPUT

      - name: Build and Test Chronon
        run: |
          make build
          if [ "${{ inputs.run_tests }}" = "true" ]; then
            make test
          fi

      - name: Prepare Maven Artifacts
        run: make prepare-artifacts FULL_VERSION=${{ steps.version_info.outputs.full_version }}

      - name: Upload All Bazel JAR Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chronon-bazel-jars
          path: chronon-artifacts/

  # Job 2: Publish the artifacts using the self-hosted runner
  publish:
    runs-on: ai-platform-dev
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download built Chronon JARs
        uses: actions/download-artifact@v4
        with:
          name: chronon-bazel-jars
          path: chronon-artifacts

      - name: Verify JAR checksums
        run: |
          echo "🔍 Verifying JAR checksums..."
          cd chronon-artifacts
          find . -name "*.jar.sha256" -exec sha256sum -c {} \;
          echo "✅ All JAR checksums verified successfully"

      - name: Display Artifact Manifest
        run: |
          echo "📋 Artifact manifest:"
          cat chronon-artifacts/ARTIFACT_MANIFEST.txt

      - name: Setup JFrog CLI
        uses: wexinc/shared-actions/fabric/artifactory-cli@v1

      - name: Publish to Artifactory
        env:
          FULL_VERSION: ${{ needs.build.outputs.build-version }}
          GROUP_ID: ${{ needs.build.outputs.group-id }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
          FORCE_OVERWRITE: ${{ github.event.inputs.force_overwrite }}
        run: |
          echo "🚀 Starting staged promotion process..."
          echo "  Version: $FULL_VERSION"
          echo "  Group ID: $GROUP_ID"
          echo "  Dry Run: $DRY_RUN"
          echo "  Force Overwrite: $FORCE_OVERWRITE"
          
          # Use the new Makefile promotion logic
          make promote-artifacts

  # Job 3: Deploy spark-assembly JAR to S3 for all regions/environments
  deploy-s3:
    needs: [build, publish]
    strategy:
      matrix:
        environment: [dev, stage, prod]
        aws_region: [us-east-1, us-west-2]
    uses: ./.github/workflows/deploy-spark-jar.yml
    with:
      environment: ${{ matrix.environment }}
      # We append uw2 suffix for us-west-2 buckets, none for us-east-1
      bucket: ai-chronon-emr-serverless-resources-${{ matrix.environment }}${{ matrix.aws_region == 'us-west-2' && '-uw2' || '' }}
      prefix: chronon-driver-jars
      dry_run: ${{ github.event.inputs.dry_run }}
      aws_region: ${{ matrix.aws_region }}
