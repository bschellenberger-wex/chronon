name: Deploy Spark Assembly JAR to S3

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      bucket:
        required: true
        type: string
      prefix:
        required: true
        type: string
      dry_run:
        required: false
        type: string
        default: false
      aws_region:
        required: true
        type: string

jobs:
  deploy:
    # Use the correct self-hosted runner naming pattern
    runs-on: ai-platform-${{ inputs.environment }}-${{ inputs.aws_region == 'us-east-1' && 'ue1' || 'uw2' }}
    env:
      AWS_REGION: ${{ inputs.aws_region }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download built Chronon JARs
        uses: actions/download-artifact@v4
        with:
          name: chronon-bazel-jars
          path: chronon-artifacts

      - name: Deploy Spark Assembly JAR to S3
        uses: ./.github/actions/deploy-spark-jar
        with:
          bucket: ${{ inputs.bucket }}
          prefix: ${{ inputs.prefix }}
          dry_run: ${{ inputs.dry_run }}
