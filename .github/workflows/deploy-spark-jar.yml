name: Deploy Spark Assembly JAR to S3

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      bucket:
        required: true
        type: string
      prefix:
        required: true
        type: string
      dry_run:
        required: false
        type: string
        default: false

jobs:
  deploy:
    # Use the correct self-hosted runner naming pattern
    runs-on: ai-platform-${{ inputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download built Chronon JARs
        uses: actions/download-artifact@v4
        with:
          name: chronon-jars
          path: chronon-artifacts

      - name: Deploy Chronon JARs to S3
        uses: ./.github/actions/deploy-spark-jar
        with:
          bucket: ${{ inputs.bucket }}
          prefix: ${{ inputs.prefix }}
          dry_run: ${{ inputs.dry_run }}
